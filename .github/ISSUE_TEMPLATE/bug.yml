name: Bug
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Leave out device ids, local keys, tokens and anything that shows your home.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
    validations:
      required: true
  - type: input
    id: robot
    attributes:
      label: Robot model
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Service logs with LOG_LEVEL=DEBUG, if you can.
      render: text
