name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag the next version and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/motalabs/tuya-lds-vacuum-map
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          subjects=$(git log --format=%s "${latest:+$latest..}HEAD")
          if grep -qE '^[a-z]+(\([^)]*\))?!: ' <<< "$subjects"; then
            level=major
          elif grep -qE '^feat(\([^)]*\))?: ' <<< "$subjects"; then
            level=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?: ' <<< "$subjects"; then
            level=patch
          else
            echo "Nothing to release since ${latest:-the first commit}."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$level" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "Releasing a $level version after ${latest:-nothing}."
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Push the tag
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build and push the image
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --pull --build-arg VERSION="${TAG#v}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:${TAG#v}" --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" .
          for tag in "${TAG#v}" "$TAG" latest; do
            docker push "$IMAGE:$tag"
          done
