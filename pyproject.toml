[project]
name = "tuya-lds-vacuum-map"
version = "0.1.0"
description = "Map bridge for Tuya LDS (laser) robot vacuums in Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3",
    "lz4>=4.3",
    "pillow>=11.0",
    "websockets>=14.0",
]

[project.scripts]
tuya-lds-vacuum-map = "tuya_lds_vacuum_map.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PT", "ASYNC", "RUF"]
